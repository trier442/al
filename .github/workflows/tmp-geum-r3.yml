name: 금환기봉 재검수 조립 게시

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-geum-r3.yml"

permissions:
  contents: write

jobs:
  assemble-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 원고 조립 및 무결성 확인
        shell: bash
        run: |
          TARGET="wordpress-content/2027-suteuk-geumhwangibong.html"
          cat scripts/tmp-geum-r3.part01 scripts/tmp-geum-r3.part02 scripts/tmp-geum-r3.part03 scripts/tmp-geum-r3.part04 scripts/tmp-geum-r3.part05 scripts/tmp-geum-r3.part06 > "$TARGET"
          ACTUAL=$(sha256sum "$TARGET" | awk '{print $1}')
          EXPECTED="73835553a5ec3adca63934e6422a2538ccede8ca46e7d73b89e0bb2bb2dfc4f6"
          echo "assembled sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          grep -q '<!-- revision: 3 -->' "$TARGET"
          test "$(grep -o 'class=\"quiz\" data-answer=' "$TARGET" | wc -l)" -eq 10
          test "$(grep -o 'class=\"choice\" data-choice=' "$TARGET" | wc -l)" -eq 50
          test "$(grep -o '<li><strong>[①②③④⑤]</strong>' "$TARGET" | wc -l)" -eq 50
          ! grep -Eq '㉠|㉡|㉢|㉣|㉤' "$TARGET"

      - name: 최종 원고 커밋 및 임시 파일 정리
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-geum-r3.part01 scripts/tmp-geum-r3.part02 scripts/tmp-geum-r3.part03 scripts/tmp-geum-r3.part04 scripts/tmp-geum-r3.part05 scripts/tmp-geum-r3.part06 .github/workflows/tmp-geum-r3.yml
          git add wordpress-content/2027-suteuk-geumhwangibong.html
          git commit -m "실전2회 금환기봉 EBS 원본 기준 전수 재검수 교정"
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: WordPress로 전송
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: "65000"
        run: |
          node scripts/publish-wordpress.mjs wordpress-content/2027-suteuk-geumhwangibong.html
          echo "WordPress 게시 확인 완료 — success"
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
