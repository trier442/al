name: Fix hwajak index and homepage
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-hwajak-index-home.mjs'
      - '.github/workflows/fix-hwajak-index-home.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fix and verify public hwajak navigation
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/fix-hwajak-index-home.mjs
