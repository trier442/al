name: Find common1 and reading links
on:
  push:
    branches: [main]
    paths:
      - 'scripts/find-common1-reading.mjs'
      - '.github/workflows/find-common1-reading.yml'
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Find
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/find-common1-reading.mjs
