name: 비상 공통국어2 5-2 논증하는 글 쓰기 재검수 게시
on:
  push:
    paths:
      - '.github/workflows/tmp-bisang-common2-u52-argument-r2.yml'
permissions:
  contents: write
jobs:
  rebuild-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 원고 복원 및 검증
        shell: bash
        run: |
          set -euo pipefail
          P0='scripts/tmp-bisang-common2-u52-argument.part00'
          P1='scripts/tmp-bisang-common2-u52-argument.part01'
          T='wordpress-content/bisang-kangho-common2-u14-argument.html'
          test "$(sha256sum "$P0" | awk '{print $1}')" = '48d6b5232fb6e1393e5daaeb7ab42e0ac5a422b7e31ea73f9d12d324e9bded42'
          test "$(sha256sum "$P1" | awk '{print $1}')" = '4a62a9b402977ed4690c03d4165ebc59dec17dac0c1c2cd4bf09b7bb1f98e4e4'
          cat "$P0" "$P1" | base64 -d | gzip -d > "$T"
          test "$(sha256sum "$T" | awk '{print $1}')" = '24277a932c7bd3cbff06837b4e54190c007657b693eee09f6f9888a9137fa85f'
          grep -q '<!-- revision: 2 -->' "$T"
          test "$(grep -o '<article class=\"shortq\">' "$T" | wc -l)" -eq 15
          test "$(grep -o '<article class=\"q\">' "$T" | wc -l)" -eq 10
          test "$(grep -o '<div class=\"choice\">' "$T" | wc -l)" -eq 50
          ! grep -q '자습서' "$T"
          ! grep -q '평가문제집' "$T"
          ! grep -q '지도서' "$T"
          ! grep -q '교사용 교과서' "$T"
          ! grep -q '시험 대비 정리' "$T"
          ! grep -q '선생님의 보충 설명' "$T"
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('wordpress-content/bisang-kangho-common2-u14-argument.html').read_text(encoding='utf-8')
          arts=re.findall(r'<article class="q">([\s\S]*?)</article>',s)
          circles='①②③④⑤'
          answers=[]
          for i,a in enumerate(arts,1):
              m=re.search(r'<b>정답 ([①②③④⑤])</b>',a)
              assert m, i
              ans=circles.index(m.group(1))+1
              answers.append(ans)
              opts=[re.sub(r'<[^>]+>','',x).strip() for x in re.findall(r'<div class="choice">([\s\S]*?)</div>',a)]
              assert len(opts)==5, (i,len(opts))
              lens=[len(x) for x in opts]
              assert lens[ans-1] < max(l for j,l in enumerate(lens) if j!=ans-1), (i,lens)
          assert answers == [3,5,2,4,1,3,5,2,4,1], answers
          print('문항 구조 검증 완료:', answers)
          PY
          echo "sha256=$(sha256sum "$T" | awk '{print $1}')"
      - name: 최종 콘텐츠 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp-bisang-common2-u52-argument.part00 scripts/tmp-bisang-common2-u52-argument.part01 .github/workflows/tmp-bisang-common2-u52-argument-r2.yml
          git add wordpress-content/bisang-kangho-common2-u14-argument.html
          git commit -m '비상 강호영 공통국어2 5-2 논증하는 글 쓰기 전면 재검수'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: WordPress 재발행
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: 65000
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs wordpress-content/bisang-kangho-common2-u14-argument.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
