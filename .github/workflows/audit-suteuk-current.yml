name: 2027 수능특강 문학 현재 작품 검수

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-cain-source.py'
      - '.github/workflows/audit-suteuk-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 현재 작품 원문 보강 및 검수
        run: python scripts/patch-cain-source.py
      - name: 검수본 저장소 반영
        run: |
          TARGET=$(cat .audit-target)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if ! git diff --cached --quiet; then
            git commit -m "Add EBS source excerpt to Cains Descendants post"
            git push
          fi
      - name: WordPress 실제 글 갱신
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          TARGET=$(cat .audit-target)
          node scripts/publish-wordpress.mjs "$TARGET"
      - name: 공개 상태 검증
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const target = fs.readFileSync('.audit-target','utf8').trim();
          const html = fs.readFileSync(target,'utf8');
          const meta = Object.fromEntries([...html.matchAll(/^<!--\s*([a-z_]+):\s*(.*?)\s*-->$/gmi)].map(m=>[m[1],m[2]]));
          const base = process.env.WP_URL.replace(/\/$/, '');
          const auth = 'Basic ' + Buffer.from(`${process.env.WP_USERNAME}:${process.env.WP_APP_PASSWORD.replace(/\s/g,'')}`).toString('base64');
          const url = meta.post_id ? `${base}/wp-json/wp/v2/posts/${meta.post_id}?context=edit` : `${base}/wp-json/wp/v2/posts?slug=${encodeURIComponent(meta.slug)}&context=edit`;
          const r = await fetch(url,{headers:{Authorization:auth}});
          if (!r.ok) throw new Error(`REST ${r.status}`);
          const data = await r.json();
          const p = Array.isArray(data) ? data[0] : data;
          if (!p || p.status !== 'publish') throw new Error('publish verification failed');
          const c = p.content?.raw || p.content?.rendered || '';
          for (const token of ['수능특강 수록 원문','S#32. 훈의 방 안','S#33. 과수원','S#101. 마당','우리는 부부가 되시요!']) {
            if (!c.includes(token)) throw new Error(`missing live token: ${token}`);
          }
          if ((c.match(/class="quiz"/g)||[]).length !== 10) throw new Error('quiz count mismatch');
          console.log(JSON.stringify({id:p.id,status:p.status,link:p.link,title:p.title?.raw || p.title?.rendered},null,2));
          NODE
