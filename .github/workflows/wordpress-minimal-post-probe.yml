name: WordPress 최소 글 생성 진단

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wordpress-minimal-post-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: WordPress REST 최소 생성 진단
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          node <<'NODE' > /tmp/wp-probe.json
          const baseUrl = process.env.WP_URL.replace(/\/$/, '');
          const password = process.env.WP_APP_PASSWORD.replace(/\s/g, '');
          const auth = 'Basic ' + Buffer.from(`${process.env.WP_USERNAME}:${password}`).toString('base64');

          async function request(path, options = {}) {
            const response = await fetch(baseUrl + path, {
              ...options,
              headers: { Authorization: auth, ...(options.headers || {}) },
              redirect: 'manual',
            });
            const text = await response.text();
            let data;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }
            return {
              ok: response.ok,
              status: response.status,
              location: response.headers.get('location'),
              data,
            };
          }

          const result = { checked_at: new Date().toISOString(), probes: [] };

          const me = await request('/wp-json/wp/v2/users/me?context=edit');
          result.user = {
            status: me.status,
            id: me.data?.id,
            name: me.data?.name,
            roles: me.data?.roles,
            capabilities: {
              edit_posts: !!me.data?.capabilities?.edit_posts,
              publish_posts: !!me.data?.capabilities?.publish_posts,
              manage_categories: !!me.data?.capabilities?.manage_categories,
              assign_categories: !!me.data?.capabilities?.assign_categories,
              assign_post_tags: !!me.data?.capabilities?.assign_post_tags,
            },
          };

          const tax = await request('/wp-json/wp/v2/taxonomies?context=edit');
          result.taxonomies = {
            category_assign_terms: tax.data?.category?.capabilities?.assign_terms,
            post_tag_assign_terms: tax.data?.post_tag?.capabilities?.assign_terms,
          };

          const cases = [
            ['minimal', { title: '__modu_probe_minimal__', status: 'draft' }],
            ['empty_categories', { title: '__modu_probe_empty_categories__', status: 'draft', categories: [] }],
            ['empty_tags', { title: '__modu_probe_empty_tags__', status: 'draft', tags: [] }],
            ['category_1', { title: '__modu_probe_category_1__', status: 'draft', categories: [1] }],
          ];

          for (const [name, payload] of cases) {
            const created = await request('/wp-json/wp/v2/posts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(payload),
            });
            const entry = {
              name,
              request: payload,
              status: created.status,
              ok: created.ok,
              response: created.data,
            };
            if (created.ok && created.data?.id) {
              const removed = await request(`/wp-json/wp/v2/posts/${created.data.id}?force=true`, { method: 'DELETE' });
              entry.cleanup = { status: removed.status, ok: removed.ok, response: removed.data };
            }
            result.probes.push(entry);
          }

          console.log(JSON.stringify(result, null, 2));
          NODE
          cat /tmp/wp-probe.json

      - name: 진단 결과 저장
        run: |
          cp /tmp/wp-probe.json scripts/wordpress-minimal-post-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/wordpress-minimal-post-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record WordPress minimal post probe [skip ci]"
            git push origin HEAD:main
          fi
