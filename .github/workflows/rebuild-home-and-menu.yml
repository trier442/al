name: Rebuild homepage and primary navigation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rebuild-home-and-menu.mjs'
      - '.github/workflows/rebuild-home-and-menu.yml'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild homepage and menu
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/rebuild-home-and-menu.mjs
