name: 비상 공통국어2 3-2 복합양식 재검수 게시

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-bisang-common2-u32-multimodal-r2.yml'

permissions:
  contents: write

jobs:
  rebuild-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 원고 복원 및 구조 검증
        shell: bash
        run: |
          set -euo pipefail
          B='scripts/tmp-bisang-common2-u32-multimodal.gz.b64'
          T='wordpress-content/bisang-kangho-common2-u09-multimodal.html'
          test "$(sha256sum "$B" | awk '{print $1}')" = 'dc6f9ffd99dd4870aa7e1eccda2e523729d4ceb6652b243370a55cabd19972ea'
          base64 -d "$B" | gzip -d > "$T"
          test "$(sha256sum "$T" | awk '{print $1}')" = 'f2e6642f15c6e41f3d238a0f1f5e8b6fe9b132e797eeed959dfac3334ef05e60'
          grep -q '<!-- revision: 2 -->' "$T"
          test "$(grep -o '<article class=\"q\">' "$T" | wc -l)" -eq 10
          test "$(grep -o '<article class=\"shortq\">' "$T" | wc -l)" -eq 15
          test "$(grep -o '<div class=\"choice\">' "$T" | wc -l)" -eq 50
          ! grep -q '자습서' "$T"
          ! grep -q '평가문제집' "$T"
          ! grep -q '지도서' "$T"
          ! grep -q '교사용 교과서' "$T"
          ! grep -q '시험 대비 정리' "$T"
          ! grep -q '선생님의 보충 설명' "$T"
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('wordpress-content/bisang-kangho-common2-u09-multimodal.html').read_text(encoding='utf-8')
          arts=re.findall(r'<article class="q">([\s\S]*?)</article>',s)
          circles='①②③④⑤'
          answers=[]
          for i,a in enumerate(arts,1):
              m=re.search(r'<b>정답 ([①②③④⑤])</b>',a)
              assert m, i
              ans=circles.index(m.group(1))+1
              answers.append(ans)
              opts=[re.sub(r'<[^>]+>','',x).strip() for x in re.findall(r'<div class="choice">([\s\S]*?)</div>',a)]
              assert len(opts)==5, (i,len(opts))
              lens=[len(x) for x in opts]
              assert lens[ans-1] < max(l for j,l in enumerate(lens) if j!=ans-1), (i,lens)
          assert answers == [3,5,2,4,1,3,5,2,4,1], answers
          print('문항 구조 검증 완료:', answers)
          PY
          echo "sha256=$(sha256sum "$T" | awk '{print $1}')"
      - name: 최종 콘텐츠 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp-bisang-common2-u32-multimodal.gz.b64 .github/workflows/tmp-bisang-common2-u32-multimodal-r2.yml
          git add wordpress-content/bisang-kangho-common2-u09-multimodal.html
          git commit -m '비상 강호영 공통국어2 3-2 복합양식 전면 재검수'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: WordPress 재발행
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: '65000'
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs wordpress-content/bisang-kangho-common2-u09-multimodal.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
