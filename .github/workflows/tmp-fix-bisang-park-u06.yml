name: 비상 박영민 공통국어2 2-2 최종 검수
# retry: q2 and q6 option-length validation repaired
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-bisang-park-u06.yml'
permissions:
  contents: write
jobs:
  fix-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 문항 최종 검수
        run: python scripts/tmp-fix-bisang-park-u06.py
      - name: 수정 사항 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp-fix-bisang-park-u06.py .github/workflows/tmp-fix-bisang-park-u06.yml
          git add wordpress-content/bisang-park-common2-u06-orthography.html
          git commit -m '비상 박영민 공통국어2 2-2 문항 최종 교정'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: WordPress 재발행
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: '65000'
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs wordpress-content/bisang-park-common2-u06-orthography.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
