name: Read old homepage revision links
on:
  push:
    branches: [main]
    paths:
      - 'scripts/read-old-home-links.mjs'
      - '.github/workflows/read-old-home-links.yml'
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/read-old-home-links.mjs
