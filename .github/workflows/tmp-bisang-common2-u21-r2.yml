name: 비상 공통국어2 2-1 청산별곡·십년 경영 재검수 게시
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-bisang-common2-u21-r2.yml'
permissions:
  contents: write
jobs:
  rebuild-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 원고 복원 및 구조 검증
        shell: bash
        run: |
          set -euo pipefail
          C='scripts/tmp-bisang-common2-u21-cheong.gz.b64'
          S='scripts/tmp-bisang-common2-u21-sip.gz.b64'
          CT='wordpress-content/bisang-kangho-common2-u03-cheongsan.html'
          ST='wordpress-content/bisang-kangho-common2-u04-sipnyeon.html'
          test "$(sha256sum "$C" | awk '{print $1}')" = '432161b63d0f0356a2a39a7b26a1a3743797d62f08284d83b4f72b35f7b56b56'
          test "$(sha256sum "$S" | awk '{print $1}')" = '32bcb1bdafd664995570824f59ed5002e7f9d89bc34dcaedb1eab20a17fa75c9'
          base64 -d "$C" | gzip -d > "$CT"
          base64 -d "$S" | gzip -d > "$ST"
          test "$(sha256sum "$CT" | awk '{print $1}')" = '100c5661af8fecb6d876dfb645bffb659af3ca78b9ec5412be6c39db5b865d95'
          test "$(sha256sum "$ST" | awk '{print $1}')" = '540046e99eccbdf1a853c7e741d8c37a86d27e4a6c0024f413b66cc40d427d2b'
          for F in "$CT" "$ST"; do
            grep -q '<!-- revision: 2 -->' "$F"
            test "$(grep -o '<article class=\"q\"' "$F" | wc -l)" -eq 10
            test "$(grep -o 'class=\"choice\"' "$F" | wc -l)" -eq 50
            test "$(grep -o '<article class=\"shortq\"' "$F" | wc -l)" -eq 12
            test "$(grep -o '<details class=\"solution\"' "$F" | wc -l)" -eq 10
            ! grep -q '자습서' "$F"
            ! grep -q '평가문제집' "$F"
            ! grep -q '지도서' "$F"
            ! grep -q '교사용 교과서' "$F"
            ! grep -q '소단원 평가' "$F"
            ! grep -q '시험 대비 정리' "$F"
            ! grep -q '선생님의 보충 설명' "$F"
            A="$(grep -o 'data-answer=\"[1-5]\"' "$F" | sed -E 's/[^1-5]//g' | paste -sd' ' -)"
            test "$A" = '3 5 2 4 1 3 5 2 4 1'
            echo "$F sha256=$(sha256sum "$F" | awk '{print $1}') answers=$A"
          done
          python - <<'PY'
          import re
          from pathlib import Path
          for p in [Path('wordpress-content/bisang-kangho-common2-u03-cheongsan.html'), Path('wordpress-content/bisang-kangho-common2-u04-sipnyeon.html')]:
              s=p.read_text(encoding='utf-8')
              arts=re.findall(r'<article class="q"[\s\S]*?</article>',s)
              for i,a in enumerate(arts,1):
                  ans=int(re.search(r'data-answer="([1-5])"',a).group(1))
                  choices=[re.sub(r'<[^>]+>','',x).strip() for x in re.findall(r'<div class="choice">([\s\S]*?)</div>',a)]
                  lens=[len(x) for x in choices]
                  if lens[ans-1] >= max(l for j,l in enumerate(lens) if j != ans-1):
                      raise SystemExit(f'{p.name} 문항 {i}: 정답이 최장 선택지임 {lens}')
              print(f'{p.name}: 10문항 정답 최장 선택지 0개')
          PY
      - name: 최종 콘텐츠 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp-bisang-common2-u21-cheong.gz.b64 scripts/tmp-bisang-common2-u21-sip.gz.b64 .github/workflows/tmp-bisang-common2-u21-r2.yml
          git add wordpress-content/bisang-kangho-common2-u03-cheongsan.html wordpress-content/bisang-kangho-common2-u04-sipnyeon.html
          git commit -m '비상 강호영 공통국어2 2-1 두 작품 전면 재검수'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: WordPress 재발행
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: 65000
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs \
            wordpress-content/bisang-kangho-common2-u03-cheongsan.html \
            wordpress-content/bisang-kangho-common2-u04-sipnyeon.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
