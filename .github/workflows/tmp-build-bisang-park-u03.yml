name: 비상 박영민 공통국어2 1-2 정재승 게시

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-build-bisang-park-u03.yml"

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 정재승 학습 페이지 생성
        run: python scripts/tmp-build-bisang-park-u03.py

      - name: 공개 내용 검증
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, html
          p=Path('wordpress-content/bisang-park-common2-u03-creative-brain.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('<article class="q">') == 10
          assert s.count('<article class="shortq">') == 15
          assert s.count('<div class="card"><strong>') >= 15
          keys=[int(x) for x in re.findall(r'<p><b>정답 ([①②③④⑤])</b></p>',s)] if False else []
          expected=['정답 ③','정답 ⑤','정답 ②','정답 ④','정답 ①','정답 ③','정답 ⑤','정답 ②','정답 ④','정답 ①']
          pos=[]
          start=0
          for x in expected:
              i=s.find(x,start); assert i>=0,x; pos.append(i); start=i+1
          for phrase in ['필요한 문항','편집 지침','편집 원칙','정답 배열','선택지 길이','가장 긴 선택지','문제 구성 원칙','순차 검수 예정']:
              assert phrase not in html.unescape(re.sub(r'<[^>]+>',' ',s)), phrase
          idx=Path('wordpress-content/bisang-park-common2-index.html').read_text(encoding='utf-8')
          assert 'bisang-park-common2-u03-creative-brain/' in idx
          assert '① 정재승 「창의적인 사람들의 뇌에서는 무슨 일이 벌어질까」' in idx
          print('VALIDATION_OK')
          PY

      - name: 최종 콘텐츠 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp-build-bisang-park-u03.py .github/workflows/tmp-build-bisang-park-u03.yml
          git add wordpress-content/bisang-park-common2-u03-creative-brain.html wordpress-content/bisang-park-common2-index.html
          git commit -m '비상 박영민 공통국어2 1-2 정재승 발표 해설 추가'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: WordPress 재발행
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: "65000"
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs wordpress-content/bisang-park-common2-u03-creative-brain.html wordpress-content/bisang-park-common2-index.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
