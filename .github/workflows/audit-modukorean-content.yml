name: Audit Modukorean content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-modukorean-content.mjs'
      - '.github/workflows/audit-modukorean-content.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit WordPress content
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/audit-modukorean-content.mjs
