name: 실전2회 05~10 갈래복합 재검수 조립 게시

on:
  push:
    paths:
      - '.github/workflows/tmp-lit2-0510-r3.yml'

permissions:
  contents: write

jobs:
  assemble-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 원고 조립 및 무결성 확인
        shell: bash
        run: |
          set -euo pipefail
          PARK='wordpress-content/2027-suteuk-park-mokwol-mountain.html'
          MOON='wordpress-content/2027-suteuk-moon-junghui-flow.html'
          HEO='wordpress-content/2027-suteuk-heo-gyun-hanjeongnok-seo.html'

          base64 -d scripts/tmp-lit2-0510-park.part00 | gzip -d > "$PARK"
          base64 -d scripts/tmp-lit2-0510-moon.full.b64 | gzip -d > "$MOON"
          base64 -d scripts/tmp-lit2-0510-heo.full.b64 | gzip -d > "$HEO"

          test "$(sha256sum "$PARK" | awk '{print $1}')" = '8756fff12a2855fbb423b85d6c8d7c995e9e6de68b93c3ac8568a62f470b2bc3'
          test "$(sha256sum "$MOON" | awk '{print $1}')" = '2f2da18c2085fab526c833251536ed4cc7139c9aaa91659126a0cfa1eb594ff8'
          test "$(sha256sum "$HEO" | awk '{print $1}')" = 'fc5ba6b5c2b6112aa07cc8089c67e3e8ac3cdfe000684febd7cb68840e6edddd'

          for f in "$PARK" "$MOON" "$HEO"; do
            grep -q '<!-- revision: 3 -->' "$f"
            test "$(grep -o 'class=\"quiz\"' "$f" | wc -l)" -eq 10
            test "$(grep -o 'class=\"choice\"' "$f" | wc -l)" -eq 50
            test "$(grep -o '<li><strong>[①②③④⑤]</strong>' "$f" | wc -l)" -eq 50
            ! grep -Eq '㉠|㉡|㉢|㉣|㉤|㉮|ⓐ|ⓑ' "$f"
          done

          echo "park sha256=$(sha256sum "$PARK" | awk '{print $1}')"
          echo "moon sha256=$(sha256sum "$MOON" | awk '{print $1}')"
          echo "heo sha256=$(sha256sum "$HEO" | awk '{print $1}')"

      - name: 최종 원고 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            scripts/tmp-lit2-0510-park.gz.b64 \
            scripts/tmp-lit2-0510-moon.gz.b64 \
            scripts/tmp-lit2-0510-heo.gz.b64 \
            scripts/tmp-lit2-0510-park.part00 \
            scripts/tmp-lit2-0510-moon.full.b64 \
            scripts/tmp-lit2-0510-heo.full.b64 \
            .github/workflows/tmp-lit2-0510-r3.yml
          git add wordpress-content/2027-suteuk-park-mokwol-mountain.html wordpress-content/2027-suteuk-moon-junghui-flow.html wordpress-content/2027-suteuk-heo-gyun-hanjeongnok-seo.html
          git commit -m '실전2회 05~10 갈래복합 EBS 원본 기준 전수 재검수 교정'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: WordPress로 전송
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: '65000'
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs \
            wordpress-content/2027-suteuk-park-mokwol-mountain.html \
            wordpress-content/2027-suteuk-moon-junghui-flow.html \
            wordpress-content/2027-suteuk-heo-gyun-hanjeongnok-seo.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
