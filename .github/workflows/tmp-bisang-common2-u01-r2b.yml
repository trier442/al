name: 비상 공통국어2 1-1 재검수 조립 게시 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-bisang-common2-u01-r2b.yml'

permissions:
  contents: write

jobs:
  assemble-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 원고 조립 및 무결성 확인
        shell: bash
        run: |
          set -euo pipefail
          C0='scripts/tmp-bisang-common2-u01-r2b.c0'
          C1='scripts/tmp-bisang-common2-u01-r2b.c1'
          C2='scripts/tmp-bisang-common2-u01-r2b.c2'
          TARGET='wordpress-content/bisang-kangho-common2-u01-ai.html'
          test "$(sha256sum "$C0" | awk '{print $1}')" = '8d4d26bdf2ea527bc118ac992d6550fe9031fdfde14e879edbdc3250823438a4'
          test "$(sha256sum "$C1" | awk '{print $1}')" = '0c2de6160c75531f08dc41578b6f507d4a74ca7415d91e069b9ce4d106497be8'
          test "$(sha256sum "$C2" | awk '{print $1}')" = '87d928aba21fd0fdccab0a5f71c8603d61412b9be82e65fe65c884bb68c2bb07'
          cat "$C0" "$C1" "$C2" > /tmp/u01.b64
          test "$(sha256sum /tmp/u01.b64 | awk '{print $1}')" = '20c929909a928f06f245f2d9c599bfe73456f9f6a567e1f94f3c2c9b0b1f3cf4'
          base64 -d /tmp/u01.b64 | gzip -d > "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = '44155d41abb31c8b222ab87dd918ed8796bcd87ebe38f5dbdcafcb5fbaa15256'
          grep -q '<!-- revision: 2 -->' "$TARGET"
          grep -q '인간보다 우월한 능력을 지닌 로봇이 인간에 미칠 영향' "$TARGET"
          grep -q '인공 지능 시대를 살아가는 인간의 바람직한 자세' "$TARGET"
          grep -q '인공 지능의 개념과 핵심 기술 및 발전 양상' "$TARGET"
          grep -q '주제 통합적 읽기' "$TARGET"
          test "$(grep -o 'class=\"q\"' "$TARGET" | wc -l)" -eq 10
          test "$(grep -o 'class=\"choice\"' "$TARGET" | wc -l)" -eq 50
          test "$(grep -o 'class=\"sa\"' "$TARGET" | wc -l)" -eq 15
          ANSWERS="$(grep -o 'data-answer=\"[1-5]\"' "$TARGET" | sed -E 's/[^1-5]//g' | paste -sd' ' -)"
          test "$ANSWERS" = '3 5 2 4 1 3 5 2 4 1'
          echo "sha256=$(sha256sum "$TARGET" | awk '{print $1}')"
          echo "answers=$ANSWERS"

      - name: 최종 원고 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            scripts/tmp-bisang-common2-u01-r2.part0 \
            scripts/tmp-bisang-common2-u01-r2.part1 \
            scripts/tmp-bisang-common2-u01-r2b.c0 \
            scripts/tmp-bisang-common2-u01-r2b.c1 \
            scripts/tmp-bisang-common2-u01-r2b.c2 \
            .github/workflows/tmp-bisang-common2-u01-r2.yml \
            .github/workflows/tmp-bisang-common2-u01-r2b.yml
          git add wordpress-content/bisang-kangho-common2-u01-ai.html
          git commit -m '비상 강호영 공통국어2 1-1 인공 지능 다양한 관점 전수 재검수 교정'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: WordPress로 전송
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: 65000
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs wordpress-content/bisang-kangho-common2-u01-ai.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
