name: WordPress 선택 게시

on:
  push:
    branches: [main]
    paths:
      - "scripts/wordpress-publish-targets.txt"
      - "scripts/publish-wordpress.mjs"
      - ".github/workflows/wordpress-targeted-publish.yml"
  workflow_dispatch:
    inputs:
      file:
        description: "게시할 wordpress-content HTML 파일 경로"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wordpress-targeted-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 게시 대상 확인
        id: files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.file }}" ]; then
            FILES="${{ inputs.file }}"
          else
            if [ ! -f scripts/wordpress-publish-targets.txt ]; then
              echo "scripts/wordpress-publish-targets.txt 파일이 없습니다." >&2
              exit 1
            fi
            FILES=$(grep -vE '^\s*(#|$)' scripts/wordpress-publish-targets.txt | tr '\n' ' ')
          fi

          if [ -z "$FILES" ]; then
            echo "게시할 HTML 파일을 찾지 못했습니다." >&2
            exit 1
          fi

          for f in $FILES; do
            case "$f" in
              wordpress-content/*.html|wordpress-content/**/*.html) ;;
              *) echo "허용되지 않은 게시 대상: $f" >&2; exit 1 ;;
            esac
            if [ ! -f "$f" ]; then
              echo "게시 대상 파일이 없습니다: $f" >&2
              exit 1
            fi
          done

          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "게시 대상: $FILES"

      - name: WordPress로 전송
        id: publish
        continue-on-error: true
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/wordpress-publish.log
          const { spawnSync } = await import('node:child_process');
          const baseUrl = process.env.WP_URL.replace(/\/$/, '');
          const password = process.env.WP_APP_PASSWORD.replace(/\s/g, '');
          const auth = 'Basic ' + Buffer.from(`${process.env.WP_USERNAME}:${password}`).toString('base64');
          const files = (process.env.FILES || '').trim().split(/\s+/).filter(Boolean);

          async function request(path, options = {}) {
            const response = await fetch(baseUrl + path, {
              ...options,
              headers: { Authorization: auth, ...(options.headers || {}) },
              redirect: 'manual',
            });
            const text = await response.text();
            let data;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }
            return { ok: response.ok, status: response.status, location: response.headers.get('location'), data };
          }

          async function setPluginStatus(plugin, status) {
            const endpoint = '/wp-json/wp/v2/plugins/' + plugin.split('/').map(encodeURIComponent).join('/');
            return request(endpoint, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify({ status }),
            });
          }

          async function taxonomyState() {
            const [me, tax] = await Promise.all([
              request('/wp-json/wp/v2/users/me?context=edit'),
              request('/wp-json/wp/v2/taxonomies?context=edit'),
            ]);
            const caps = me.data?.capabilities || {};
            const categoryCap = tax.data?.category?.capabilities?.assign_terms || '';
            const tagCap = tax.data?.post_tag?.capabilities?.assign_terms || '';
            return {
              categoryCap,
              tagCap,
              canCategory: Boolean(caps[categoryCap]),
              canTag: Boolean(caps[tagCap]),
              assign_categories: Boolean(caps.assign_categories),
              assign_post_tags: Boolean(caps.assign_post_tags),
              edit_posts: Boolean(caps.edit_posts),
            };
          }

          const candidates = [
            'modukorean-site-manager/modukorean-site-manager',
            'insert-headers-and-footers/ihaf',
            'modu-hwajak-unit-editor/modu-hwajak-unit-editor',
            'modu-hwajak-quality-rebuilder/modu-hwajak-quality-rebuilder',
          ];

          const pluginsResponse = await request('/wp-json/wp/v2/plugins?context=edit');
          const activePlugins = new Set(
            Array.isArray(pluginsResponse.data)
              ? pluginsResponse.data.filter(p => p.status === 'active').map(p => p.plugin)
              : []
          );

          console.log('게시 전 taxonomy 상태:', JSON.stringify(await taxonomyState()));
          let pausedPlugin = '';
          let publisherStatus = 1;

          try {
            for (const plugin of candidates) {
              if (!activePlugins.has(plugin)) continue;
              console.log(`원인 확인을 위해 잠시 비활성화: ${plugin}`);
              const off = await setPluginStatus(plugin, 'inactive');
              if (!off.ok) {
                console.log(`비활성화 실패 ${plugin}: HTTP ${off.status} ${JSON.stringify(off.data).slice(0, 800)}`);
                continue;
              }

              const state = await taxonomyState();
              console.log(`비활성화 후 taxonomy 상태 ${plugin}: ${JSON.stringify(state)}`);
              if (state.canCategory && state.canTag) {
                pausedPlugin = plugin;
                console.log(`원인 플러그인으로 판단: ${plugin}`);
                break;
              }

              const on = await setPluginStatus(plugin, 'active');
              console.log(`즉시 재활성화 ${plugin}: HTTP ${on.status}`);
            }

            if (!pausedPlugin) {
              console.log('비표준 taxonomy 권한을 정상화하는 단일 플러그인을 찾지 못했습니다. 현재 상태에서 게시를 시도합니다.');
            } else {
              console.log(`게시 중에만 일시 중지 유지: ${pausedPlugin}`);
            }

            const child = spawnSync('node', ['scripts/publish-wordpress.mjs', ...files], {
              env: process.env,
              encoding: 'utf8',
              maxBuffer: 20 * 1024 * 1024,
            });
            if (child.stdout) process.stdout.write(child.stdout);
            if (child.stderr) process.stderr.write(child.stderr);
            publisherStatus = Number.isInteger(child.status) ? child.status : 1;
          } finally {
            if (pausedPlugin) {
              const on = await setPluginStatus(pausedPlugin, 'active');
              console.log(`게시 후 재활성화 ${pausedPlugin}: HTTP ${on.status}`);
              const pluginList = await request('/wp-json/wp/v2/plugins?context=edit');
              const verify = Array.isArray(pluginList.data)
                ? pluginList.data.find(p => p.plugin === pausedPlugin)?.status
                : 'unknown';
              console.log(`재활성화 확인 ${pausedPlugin}: ${verify}`);
              if (!on.ok || verify !== 'active') publisherStatus = 1;
            }
          }

          process.exit(publisherStatus);
          NODE

      - name: 게시 결과 기록
        if: always() && steps.files.outcome == 'success'
        shell: bash
        env:
          FILES: ${{ steps.files.outputs.files }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone

          log_path = Path('/tmp/wordpress-publish.log')
          output = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          links = re.findall(r'(?:생성|갱신):\s+(https?://\S+)\s+\[', output)
          data = {
              'status': 'success' if os.environ.get('PUBLISH_OUTCOME') == 'success' else 'failure',
              'published_at_utc': datetime.now(timezone.utc).isoformat(),
              'event': os.environ.get('EVENT_NAME'),
              'source_sha': os.environ.get('SOURCE_SHA'),
              'files': os.environ.get('FILES', '').split(),
              'wordpress_links': links,
              'log': output.strip(),
          }
          Path('scripts/wordpress-last-publish.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/wordpress-last-publish.json
          if ! git diff --cached --quiet; then
            git commit -m "Record WordPress publish status [skip ci]"
            git push origin HEAD:main
          fi

      - name: 게시 실패 처리
        if: steps.publish.outcome != 'success'
        run: exit 1
