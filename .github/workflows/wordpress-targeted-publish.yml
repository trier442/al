name: WordPress 선택 게시

on:
  push:
    branches: [main]
    paths:
      - "scripts/wordpress-publish-targets.txt"
      - "scripts/publish-wordpress.mjs"
      - ".github/workflows/wordpress-targeted-publish.yml"
  workflow_dispatch:
    inputs:
      file:
        description: "게시할 wordpress-content HTML 파일 경로"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wordpress-targeted-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 게시 대상 확인
        id: files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.file }}" ]; then
            FILES="${{ inputs.file }}"
          else
            if [ ! -f scripts/wordpress-publish-targets.txt ]; then
              echo "scripts/wordpress-publish-targets.txt 파일이 없습니다." >&2
              exit 1
            fi
            FILES=$(grep -vE '^\s*(#|$)' scripts/wordpress-publish-targets.txt | tr '\n' ' ')
          fi

          if [ -z "$FILES" ]; then
            echo "게시할 HTML 파일을 찾지 못했습니다." >&2
            exit 1
          fi

          for f in $FILES; do
            case "$f" in
              wordpress-content/*.html|wordpress-content/**/*.html) ;;
              *) echo "허용되지 않은 게시 대상: $f" >&2; exit 1 ;;
            esac
            if [ ! -f "$f" ]; then
              echo "게시 대상 파일이 없습니다: $f" >&2
              exit 1
            fi
          done

          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "게시 대상: $FILES"

      - name: WordPress로 전송
        id: publish
        continue-on-error: true
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/wordpress-publish.log
          const baseUrl = process.env.WP_URL.replace(/\/$/, '');
          const password = process.env.WP_APP_PASSWORD.replace(/\s/g, '');
          const auth = 'Basic ' + Buffer.from(`${process.env.WP_USERNAME}:${password}`).toString('base64');

          async function get(path, options = {}) {
            const response = await fetch(baseUrl + path, {
              ...options,
              headers: { Authorization: auth, ...(options.headers || {}) },
              redirect: 'manual',
            });
            const text = await response.text();
            let data;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }
            return { status: response.status, location: response.headers.get('location'), data };
          }

          const tax = await get('/wp-json/wp/v2/taxonomies?context=edit');
          if (tax.data && typeof tax.data === 'object' && !Array.isArray(tax.data)) {
            const summary = {};
            for (const [key, item] of Object.entries(tax.data)) {
              summary[key] = {
                slug: item.slug,
                rest_base: item.rest_base,
                types: item.types,
                capabilities: item.capabilities,
              };
            }
            console.log('WordPress post taxonomy 진단:', JSON.stringify(summary));
          } else {
            console.log('WordPress taxonomy 조회:', JSON.stringify(tax).slice(0, 3000));
          }

          const options = await get('/wp-json/wp/v2/posts', { method: 'OPTIONS' });
          const endpoints = options.data?.endpoints || [];
          const createEndpoint = endpoints.find(item => Array.isArray(item.methods) && item.methods.includes('POST'));
          console.log('WordPress posts POST args:', JSON.stringify(createEndpoint?.args || {}).slice(0, 8000));

          const xml = await get('/xmlrpc.php', {
            method: 'POST',
            headers: { 'Content-Type': 'text/xml; charset=utf-8' },
            body: '<?xml version="1.0"?><methodCall><methodName>system.listMethods</methodName><params></params></methodCall>',
          });
          console.log('WordPress XML-RPC 진단:', JSON.stringify({ status: xml.status, location: xml.location, body: typeof xml.data === 'string' ? xml.data.slice(0, 500) : xml.data }).slice(0, 1500));
          NODE
          node scripts/publish-wordpress.mjs ${{ steps.files.outputs.files }} 2>&1 | tee -a /tmp/wordpress-publish.log

      - name: 게시 결과 기록
        if: always() && steps.files.outcome == 'success'
        shell: bash
        env:
          FILES: ${{ steps.files.outputs.files }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone

          log_path = Path('/tmp/wordpress-publish.log')
          output = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          links = re.findall(r'(?:생성|갱신):\s+(https?://\S+)\s+\[', output)
          data = {
              'status': 'success' if os.environ.get('PUBLISH_OUTCOME') == 'success' else 'failure',
              'published_at_utc': datetime.now(timezone.utc).isoformat(),
              'event': os.environ.get('EVENT_NAME'),
              'source_sha': os.environ.get('SOURCE_SHA'),
              'files': os.environ.get('FILES', '').split(),
              'wordpress_links': links,
              'log': output.strip(),
          }
          Path('scripts/wordpress-last-publish.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/wordpress-last-publish.json
          if ! git diff --cached --quiet; then
            git commit -m "Record WordPress publish status [skip ci]"
            git push origin HEAD:main
          fi

      - name: 게시 실패 처리
        if: steps.publish.outcome != 'success'
        run: exit 1
