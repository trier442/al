name: Check hwajak live state
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-hwajak-live-state.mjs'
      - '.github/workflows/check-hwajak-live-state.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check state
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/check-hwajak-live-state.mjs
