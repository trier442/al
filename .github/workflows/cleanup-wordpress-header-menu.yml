name: WordPress 상단 메뉴 정리

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup-wordpress-header-menu.mjs'
      - '.github/workflows/cleanup-wordpress-header-menu.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 상단 메뉴 중복 제거 및 재정렬
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/cleanup-wordpress-header-menu.mjs
