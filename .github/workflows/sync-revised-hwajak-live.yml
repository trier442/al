name: Sync revised hwajak live

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-revised-hwajak-live.mjs'
      - '.github/workflows/sync-revised-hwajak-live.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build revised sources
        run: |
          node scripts/standardize-hwajak-pages.mjs
          node scripts/fix-hwajak-pages.mjs
          if [ -d scripts/hwajak-overrides ]; then
            for OVERRIDE in scripts/hwajak-overrides/2027-suteuk-hwajak-*.html; do
              [ -e "$OVERRIDE" ] || continue
              cp "$OVERRIDE" "wordpress-content/$(basename "$OVERRIDE")"
            done
          fi
          node scripts/apply-hwajak-text-patches.mjs
          for PATCH in scripts/hwajak-single/*.mjs; do
            [ -e "$PATCH" ] || continue
            node "$PATCH"
          done
      - name: Validate revised sources
        run: |
          node scripts/validate-hwajak-single.mjs wordpress-content/2027-suteuk-hwajak-s01a.html
          for PATCH in scripts/hwajak-single/*.mjs; do
            SLUG="$(basename "$PATCH" .mjs)"
            node scripts/validate-hwajak-single.mjs "wordpress-content/$SLUG.html"
          done
      - name: Publish revised set and remove legacy live copies
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/sync-revised-hwajak-live.mjs
