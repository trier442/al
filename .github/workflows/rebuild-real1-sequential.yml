name: Rebuild Suteuk Sequential

on:
  push:
    branches: [main]
    paths:
      - "scripts/real1-sequential-payload.txt"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decode and validate target
        id: target
        shell: bash
        run: |
          TARGET=$(head -n 1 scripts/real1-sequential-payload.txt)
          tail -n +2 scripts/real1-sequential-payload.txt | tr -d '\n' | base64 -d | gzip -d > "$TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          python - "$TARGET" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); s=p.read_text()
          m=re.search(r'<!-- revision: (\d+) -->', s)
          assert m and int(m.group(1)) >= 2
          assert s.count('class="quiz"') == 10
          assert s.count('class="choice"') == 50
          assert '수능특강 수록 제시문 전문' in s
          assert 'EBS 원문항' not in s and '수능특강 원문제' not in s
          print('validated', p, len(s), 'revision', m.group(1))
          PY

      - name: Commit rebuilt post
        shell: bash
        run: |
          TARGET="${{ steps.target.outputs.target }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "No content change"
          else
            git commit -m "Rebuild 수특 $(basename "$TARGET" .html)"
            git push
          fi

      - name: Publish to WordPress
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: "65000"
        run: |
          TARGET="${{ steps.target.outputs.target }}"
          for ATTEMPT in 1 2; do
            echo "WordPress publish attempt ${ATTEMPT}/2"
            if node scripts/publish-wordpress.mjs "$TARGET"; then
              echo "WordPress 게시 확인 완료 — success"
              exit 0
            fi
            sleep 15
          done
          exit 1
