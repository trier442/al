name: Rebuild Real1 Sequential

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-real1-sequential.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild 황새결송
        env:
          PAYLOAD: ""
        run: |
          echo "$PAYLOAD" | base64 -d | gzip -d > wordpress-content/2027-suteuk-hwangsaegyeolsong.html
          python - <<'PY'
          from pathlib import Path
          p=Path('wordpress-content/2027-suteuk-hwangsaegyeolsong.html')
          s=p.read_text()
          assert 'revision: 2' in s
          assert s.count('class="quiz"') == 10
          assert s.count('class="choice"') == 50
          assert '수능특강 수록 제시문 전문' in s
          print('validated', p, len(s))
          PY

      - name: Commit rebuilt post
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wordpress-content/2027-suteuk-hwangsaegyeolsong.html
          if git diff --cached --quiet; then
            echo "No content change"
          else
            git commit -m "Rebuild 실전 1회 황새결송 with full passage and self-made quizzes"
            git push
          fi

      - name: Publish to WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: "65000"
        run: |
          for ATTEMPT in 1 2; do
            echo "WordPress publish attempt ${ATTEMPT}/2"
            if node scripts/publish-wordpress.mjs wordpress-content/2027-suteuk-hwangsaegyeolsong.html; then
              echo "WordPress 게시 확인 완료 — success"
              exit 0
            fi
            sleep 15
          done
          exit 1
