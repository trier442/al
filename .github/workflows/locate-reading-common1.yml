name: Locate reading and common1 links
on:
  push:
    branches: [main]
    paths:
      - 'scripts/locate-reading-common1.mjs'
      - '.github/workflows/locate-reading-common1.yml'
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Locate
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/locate-reading-common1.mjs
