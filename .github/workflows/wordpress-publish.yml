name: WordPress 게시

on:
  push:
    branches: [main]
    paths:
      - "wordpress-content/**/*.html"
      - "wordpress-content/images/**"
      - "scripts/standardize-hwajak-pages.mjs"
      - "scripts/fix-hwajak-pages.mjs"
      - "scripts/validate-hwajak-pages.mjs"
      - "scripts/lint-hwajak-language.mjs"
      - "scripts/hwajak-payload/**"
      - "scripts/standardize-common2-pages.mjs"
      - "scripts/verify-common2-seo.mjs"
      - "scripts/inspect-common2-seo-capabilities.mjs"
      - "scripts/ensure-common2-meta-description-plugin.mjs"
      - "scripts/publish-wordpress.mjs"
      - ".github/workflows/wordpress-publish.yml"
  workflow_dispatch:
    inputs:
      file:
        description: "게시할 HTML 파일 경로, ALL_HWAJAK 또는 ALL_COMMON2"
        required: true
        default: "ALL_HWAJAK"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 공통국어2 순차 링크 및 SEO 메타 보정
        run: node scripts/standardize-common2-pages.mjs

      - name: 화법과 작문 57개 원고 생성
        run: node scripts/standardize-hwajak-pages.mjs

      - name: 화법과 작문 문장 보정
        run: node scripts/fix-hwajak-pages.mjs

      - name: 화법과 작문 구성 검증
        run: node scripts/validate-hwajak-pages.mjs

      - name: 화법과 작문 언어 검증
        run: node scripts/lint-hwajak-language.mjs

      - name: 게시 대상 확인
        id: files
        shell: bash
        run: |
          COMMON2=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.file }}" = "ALL_HWAJAK" ]; then
              FILES=$(find wordpress-content -maxdepth 1 -type f -name '2027-suteuk-hwajak-*.html' | sort | tr '\n' ' ')
            elif [ "${{ inputs.file }}" = "ALL_COMMON2" ]; then
              FILES=$(find wordpress-content -maxdepth 1 -type f \( -name 'bisang-park-common2-u*.html' -o -name 'bisang-park-common2-index.html' \) | sort -V | tr '\n' ' ')
              COMMON2=true
            else
              FILES="${{ inputs.file }}"
            fi
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD)
            if printf '%s\n' "$CHANGED" | grep -Eq '^(scripts/(standardize-common2-pages|verify-common2-seo|inspect-common2-seo-capabilities|ensure-common2-meta-description-plugin|publish-wordpress)\.mjs|\.github/workflows/wordpress-publish\.yml)$'; then
              FILES=$(find wordpress-content -maxdepth 1 -type f \( -name 'bisang-park-common2-u*.html' -o -name 'bisang-park-common2-index.html' \) | sort -V | tr '\n' ' ')
              COMMON2=true
            elif printf '%s\n' "$CHANGED" | grep -Eq '^(scripts/(standardize-hwajak-pages|fix-hwajak-pages|validate-hwajak-pages|lint-hwajak-language)\.mjs|scripts/hwajak-payload/|wordpress-content/2027-suteuk-hwajak-)'; then
              FILES=$(find wordpress-content -maxdepth 1 -type f -name '2027-suteuk-hwajak-*.html' | sort | tr '\n' ' ')
            else
              FILES=$(git diff --name-only HEAD^ HEAD -- ':(glob)wordpress-content/**/*.html' | tr '\n' ' ')
              if printf '%s\n' "$FILES" | grep -q 'wordpress-content/2027-suteuk-reading-'; then
                FILES=$(find wordpress-content -maxdepth 1 -type f -name '2027-suteuk-reading-*.html' | sort | tr '\n' ' ')
              fi
            fi
          fi

          if printf '%s\n' "$FILES" | grep -q 'wordpress-content/bisang-park-common2-'; then
            COMMON2=true
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "common2=$COMMON2" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "게시 대상 HTML 변경 없음 — 게시 단계 생략"
          else
            echo "게시 대상: $(printf '%s' "$FILES" | wc -w)개"
          fi

      - name: WordPress로 전송
        if: steps.files.outputs.files != ''
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: "65000"
        run: |
          set -o pipefail
          FILES="${{ steps.files.outputs.files }}"
          for ATTEMPT in 1 2; do
            echo "WordPress 즉시 게시 시도 ${ATTEMPT}/2"
            set +e
            node scripts/publish-wordpress.mjs $FILES
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              echo "WordPress 게시 확인 완료 — success"
              exit 0
            fi
            if [ "$ATTEMPT" -eq 1 ]; then
              echo "첫 시도 실패 — 15초 뒤 한 번 더 시도합니다."
              sleep 15
            fi
          done
          echo "즉시 게시가 실패했습니다. scripts/wordpress-publish-targets.txt에 대상을 두면 WordPress 자동 복구 게시가 시간별로 재시도합니다." >&2
          exit 1

      - name: 공통국어2 meta description 출력 활성화
        if: steps.files.outputs.common2 == 'true'
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/ensure-common2-meta-description-plugin.mjs

      - name: 공통국어2 공개 페이지 SEO 검증
        if: steps.files.outputs.common2 == 'true'
        env:
          WP_URL: ${{ secrets.WP_URL }}
        run: node scripts/verify-common2-seo.mjs

      - name: WordPress SEO 기능 탐지
        if: steps.files.outputs.common2 == 'true'
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/inspect-common2-seo-capabilities.mjs
