name: WordPress 게시

on:
  push:
    branches: [main]
    paths:
      - "wordpress-content/**/*.html"
      - "wordpress-content/images/**"
      - "scripts/standardize-hwajak-pages.mjs"
      - "scripts/fix-hwajak-pages.mjs"
      - "scripts/validate-hwajak-pages.mjs"
      - "scripts/lint-hwajak-language.mjs"
      - "scripts/hwajak-payload/**"
      - ".github/workflows/wordpress-publish.yml"
  workflow_dispatch:
    inputs:
      file:
        description: "게시할 HTML 파일 경로 또는 ALL_HWAJAK"
        required: true
        default: "ALL_HWAJAK"

permissions:
  contents: read

jobs:
  publish_1:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
      published: ${{ steps.result.outputs.published }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 화법과 작문 57개 원고 생성
        run: node scripts/standardize-hwajak-pages.mjs

      - name: 화법과 작문 문장 보정
        run: node scripts/fix-hwajak-pages.mjs

      - name: 화법과 작문 구성 검증
        run: node scripts/validate-hwajak-pages.mjs

      - name: 화법과 작문 언어 검증
        run: node scripts/lint-hwajak-language.mjs

      - name: 게시 대상 확인
        id: files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.file }}" = "ALL_HWAJAK" ]; then
              FILES=$(find wordpress-content -maxdepth 1 -type f -name '2027-suteuk-hwajak-*.html' | sort | tr '\n' ' ')
            else
              FILES="${{ inputs.file }}"
            fi
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD)
            if printf '%s\n' "$CHANGED" | grep -Eq '^(scripts/(standardize-hwajak-pages|fix-hwajak-pages|validate-hwajak-pages|lint-hwajak-language)\.mjs|scripts/hwajak-payload/|wordpress-content/2027-suteuk-hwajak-)'; then
              FILES=$(find wordpress-content -maxdepth 1 -type f -name '2027-suteuk-hwajak-*.html' | sort | tr '\n' ' ')
            else
              FILES=$(git diff --name-only HEAD^ HEAD -- ':(glob)wordpress-content/**/*.html' | tr '\n' ' ')
              if printf '%s\n' "$FILES" | grep -q 'wordpress-content/2027-suteuk-reading-'; then
                FILES=$(find wordpress-content -maxdepth 1 -type f -name '2027-suteuk-reading-*.html' | sort | tr '\n' ' ')
              fi
            fi
            if [ -z "$FILES" ] && printf '%s' "${{ github.event.head_commit.message }}" | grep -Fq '[retry-spring]'; then
              FILES="wordpress-content/2027-suteuk-ryu-jangha-spring-comes.html"
              echo "복구 재시도 대상 지정: $FILES"
            fi
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "게시 대상 HTML 변경 없음 — 게시 단계 생략"
          else
            echo "게시 대상: $(printf '%s' "$FILES" | wc -w)개"
          fi

      - name: WordPress 전송 1차
        id: wp
        if: steps.files.outputs.files != ''
        continue-on-error: true
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -o pipefail
          timeout --signal=TERM 45s node scripts/publish-wordpress.mjs ${{ steps.files.outputs.files }}

      - name: 1차 결과
        id: result
        if: always()
        shell: bash
        run: |
          if [ -z "${{ steps.files.outputs.files }}" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.wp.outcome }}" = "success" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "1차 runner에서 WordPress 연결 실패 — 새 runner로 넘깁니다."
          fi

  publish_2:
    needs: publish_1
    if: needs.publish_1.outputs.published != 'true'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/standardize-hwajak-pages.mjs
      - run: node scripts/fix-hwajak-pages.mjs
      - run: node scripts/validate-hwajak-pages.mjs
      - run: node scripts/lint-hwajak-language.mjs
      - name: WordPress 전송 2차 · 새 runner
        id: wp
        continue-on-error: true
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -o pipefail
          timeout --signal=TERM 45s node scripts/publish-wordpress.mjs ${{ needs.publish_1.outputs.files }}
      - name: 2차 결과
        id: result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.wp.outcome }}" = "success" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish_3:
    needs: [publish_1, publish_2]
    if: always() && needs.publish_1.outputs.published != 'true' && needs.publish_2.outputs.published != 'true'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/standardize-hwajak-pages.mjs
      - run: node scripts/fix-hwajak-pages.mjs
      - run: node scripts/validate-hwajak-pages.mjs
      - run: node scripts/lint-hwajak-language.mjs
      - name: WordPress 전송 3차 · 새 runner
        id: wp
        continue-on-error: true
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -o pipefail
          timeout --signal=TERM 45s node scripts/publish-wordpress.mjs ${{ needs.publish_1.outputs.files }}
      - name: 3차 결과
        id: result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.wp.outcome }}" = "success" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish_4:
    needs: [publish_1, publish_2, publish_3]
    if: always() && needs.publish_1.outputs.published != 'true' && needs.publish_2.outputs.published != 'true' && needs.publish_3.outputs.published != 'true'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/standardize-hwajak-pages.mjs
      - run: node scripts/fix-hwajak-pages.mjs
      - run: node scripts/validate-hwajak-pages.mjs
      - run: node scripts/lint-hwajak-language.mjs
      - name: WordPress 전송 4차 · 새 runner
        id: wp
        continue-on-error: true
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -o pipefail
          timeout --signal=TERM 45s node scripts/publish-wordpress.mjs ${{ needs.publish_1.outputs.files }}
      - name: 4차 결과
        id: result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.wp.outcome }}" = "success" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  confirm:
    needs: [publish_1, publish_2, publish_3, publish_4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 최종 게시 판정
        shell: bash
        run: |
          if [ "${{ needs.publish_1.outputs.published }}" = "true" ] || \
             [ "${{ needs.publish_2.outputs.published }}" = "true" ] || \
             [ "${{ needs.publish_3.outputs.published }}" = "true" ] || \
             [ "${{ needs.publish_4.outputs.published }}" = "true" ]; then
            echo "WordPress 게시 최종 확인: success"
            exit 0
          fi
          echo "서로 다른 runner 4대에서 모두 WordPress 연결에 실패했습니다." >&2
          exit 1
