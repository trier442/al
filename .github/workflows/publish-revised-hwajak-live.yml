name: Publish only revised 2027 hwajak materials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-revised-hwajak-index.mjs'
      - 'scripts/sync-revised-hwajak-live.mjs'
      - '.github/workflows/publish-revised-hwajak-live.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current sources
        run: |
          node scripts/standardize-hwajak-pages.mjs
          node scripts/fix-hwajak-pages.mjs
          if [ -d scripts/hwajak-overrides ]; then
            for OVERRIDE in scripts/hwajak-overrides/2027-suteuk-hwajak-*.html; do
              [ -e "$OVERRIDE" ] || continue
              cp "$OVERRIDE" "wordpress-content/$(basename "$OVERRIDE")"
            done
          fi
          node scripts/apply-hwajak-text-patches.mjs
          for PATCH in scripts/hwajak-single/*.mjs; do
            [ -e "$PATCH" ] || continue
            node "$PATCH"
          done
          node scripts/build-revised-hwajak-index.mjs
      - name: Publish revised and hide old
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/sync-revised-hwajak-live.mjs
