name: 비상 공통국어2 최종 감사 보정
on:
  push:
    paths:
      - '.github/workflows/tmp-bisang-common2-final-fix.yml'
permissions:
  contents: write
jobs:
  fix-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 감사 지적 사항 일괄 보정
        shell: bash
        run: |
          python - <<'PY'
          import re, html
          from pathlib import Path

          ROOT=Path('wordpress-content')
          changed=[]

          def bump(path, newrev):
              s=path.read_text(encoding='utf-8')
              s,n=re.subn(r'<!--\s*revision:\s*\d+\s*-->',f'<!-- revision: {newrev} -->',s,count=1)
              assert n==1, path
              path.write_text(s,encoding='utf-8')

          def append_summary(path, addition):
              s=path.read_text(encoding='utf-8')
              # paragraph-wrapped summary first
              pat=r'(<div class="summary"><p>)([\s\S]*?)(</p></div>)'
              m=re.search(pat,s)
              if m:
                  body=m.group(2)
                  body=body.rstrip()+ ' ' + addition
                  s=s[:m.start(2)]+body+s[m.end(2):]
              else:
                  # direct text summary
                  pat2=r'(<div class="summary">)([\s\S]*?)(</div>)'
                  m=re.search(pat2,s)
                  assert m, path
                  body=m.group(2).rstrip()+ ' ' + addition
                  s=s[:m.start(2)]+body+s[m.end(2):]
              path.write_text(s,encoding='utf-8')

          # 1-1: 객관식도 스크립트 클릭식이 아닌 기본 접기/펼치기 정답 보기로 통일
          p=ROOT/'bisang-kangho-common2-u01-ai.html'
          s=p.read_text(encoding='utf-8')
          def conv_q(m):
              b=m.group(0)
              b=re.sub(r'<button type="button" class="choice" data-choice="\d+">','<div class="choice">',b)
              b=b.replace('</button>','</div>')
              n_before=b.count('<div class="fb"></div><div class="sol">')
              assert n_before==1
              b=b.replace('<div class="fb"></div><div class="sol">','<details class="answer-toggle"><summary>정답·해설 보기</summary><div class="ans">',1)
              assert b.endswith('</div></article>')
              b=b[:-len('</div></article>')]+'</div></details></article>'
              return b
          s,nq=re.subn(r'<article class="q" data-answer="\d+">[\s\S]*?</article>',conv_q,s)
          assert nq==10, nq
          # 객관식 클릭 채점 JS 제거, 빈칸 JS만 유지
          blank_script='''<script>\n(function(){\n document.querySelectorAll('.kh2 .blank').forEach(function(b){\n  b.addEventListener('click',function(){var o=b.classList.toggle('open');b.textContent=o?b.dataset.answer:'□'.repeat(Math.max(3,Math.min(7,b.dataset.answer.length)));});\n });\n})();\n</script>'''
          s,n=re.subn(r'<script>\s*\(function\(\)\{[\s\S]*?</script>\s*$',blank_script,s,count=1)
          assert n==1
          s=s.replace('<!-- revision: 4 -->','<!-- revision: 5 -->',1)
          p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # 1-2: 핵심 정리 보강 + 통합 목차 링크
          p=ROOT/'bisang-kangho-common2-u02-empathy.html'
          add=('사회적 독서는 개인이 혼자 읽고 감상을 끝내는 활동이 아니라 읽은 결과를 다른 사람과 공유하면서 지식과 정보를 교류하고, 서로 다른 삶의 방식과 가치관을 이해하는 과정이다. '
               '「공감의 반경」의 내용을 발표할 때에도 글의 핵심 주장을 그대로 나열하는 데 그치지 않고, 예상 청중의 관심사·배경지식·이해 수준·주제에 대한 태도를 분석해 설명의 깊이와 자료를 조정해야 한다. '
               '발표 중에는 청중의 반응을 살피고 질문의 의도를 파악하여 근거를 들어 답함으로써 독서에서 얻은 생각을 사회적으로 확장한다.')
          append_summary(p,add)
          s=p.read_text(encoding='utf-8')
          s=s.replace('<!-- revision: 2 -->','<!-- revision: 3 -->',1)
          if '비상-강호영-공통국어2' not in s:
              pos=s.rfind('</div>'); assert pos!=-1
              link='<p style="margin-top:26px"><a href="https://modukorean.co.kr/비상-강호영-공통국어2/" style="color:#175e36;font-weight:700">← 비상 강호영 공통국어2 통합 목차</a></p>\n'
              s=s[:pos]+link+s[pos:]
          p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # 2-1① 청산별곡 핵심 정리 보강
          p=ROOT/'bisang-kangho-common2-u03-cheongsan.html'
          append_summary(p,'청산과 바다는 모두 현실의 시름을 벗어나기 위해 화자가 지향하는 공간이지만, 공간을 옮긴다고 고통이 사라지는 것은 아니다. 제4연의 밤은 고독을 심화하고, 제5연의 돌은 이유를 특정하기 어려운 삶의 시련을 드러내며, 제8연의 술 역시 시름을 잠시 잊게 하는 일시적 위안에 가깝다. 따라서 이 작품의 자연 지향은 자연 속 안분지족을 노래한 것으로 단순화하기보다 현실에서 벗어나고 싶은 소망과 그 소망이 끝내 완전한 해결에 이르지 못하는 정서를 함께 읽어야 한다.')
          bump(p,3); changed.append(str(p))

          # 2-1② 십 년을 경영하여 핵심 정리 보강
          p=ROOT/'bisang-kangho-common2-u04-sipnyeon.html'
          append_summary(p,'시상은 초장의 오랜 준비와 소박한 집 마련에서, 중장의 달·청풍과의 동거, 종장의 광대한 강산 향유로 점차 확대된다. 특히 집의 세 칸을 인간과 자연물에게 나누어 맡기는 발상은 달과 바람을 단순한 배경이 아니라 생활의 벗으로 끌어들이며, ‘강산은 들일 데 없으니’와 ‘둘러 두고 보리라’는 작은 물질적 공간과 큰 정신적 풍요를 대비한다. 따라서 핵심은 자연으로의 도피가 아니라 자연과 함께 사는 데서 얻는 만족과 여유이다.')
          bump(p,3); changed.append(str(p))

          # 2-2① 속미인곡 핵심 정리 보강
          p=ROOT/'bisang-kangho-common2-u05-sokmiin.html'
          append_summary(p,'작품의 공간과 상황도 단계적으로 악화된다. 높은 산에서는 구름과 안개 때문에 임이 있는 곳을 볼 수 없고, 물가에서는 바람과 물결, 빈 배 때문에 소식에 다가갈 수 없다. 집으로 돌아온 뒤에도 반벽청등 아래 홀로 남고, 꿈에서조차 임에게 마음을 끝까지 전하지 못한다. 이처럼 현실의 장애와 꿈의 좌절이 겹친 끝에 낙월과 구ᄌᆞᆫ비의 소망이 제시되므로, 결말은 단순한 자연물 변신이 아니라 죽어서라도 임에게 닿고 싶은 사랑의 심화를 보여 준다.')
          bump(p,3); changed.append(str(p))

          # 2-2② 진달래꽃 핵심 정리 보강 + 출처성 표현 제거
          p=ROOT/'bisang-kangho-common2-u06-azalea.html'
          append_summary(p,'화자의 정서는 이별을 ‘참는’ 데서 끝나지 않는다. 2연에서 꽃을 뿌리는 행위는 떠나는 임의 앞길을 축복하는 산화공덕 모티프와 연결되고, 3연에서 그 꽃을 ‘즈려밟고’ 가라고 하는 말은 자신의 분신을 임에게 내어 주는 희생을 극대화한다. 마지막의 ‘죽어도 아니 눈물 흘리우리다’는 실제로 슬픔이 없다는 선언이 아니라, 눈물을 드러내지 않겠다는 반어를 통해 슬픔과 인고를 더 강하게 드러낸다. 따라서 작품의 핵심은 체념·축복·희생·인고가 단계적으로 심화되면서 오히려 임을 향한 사랑이 선명해지는 데 있다.')
          s=p.read_text(encoding='utf-8')
          old='⑤ 지도서는 사랑·정성·축복과 산화공덕 모티프로 설명한다.'
          new='⑤ 꽃을 뿌리는 행위는 사랑·정성·축복을 드러내며 산화공덕 모티프와 연결된다.'
          assert old in s
          s=s.replace(old,new)
          s=s.replace('<!-- revision: 2 -->','<!-- revision: 3 -->',1)
          p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # 3-3 함께 쓰는 보고서: 핵심 정리에 클릭형 빈칸 추가
          p=ROOT/'bisang-kangho-common2-u10-report.html'
          s=p.read_text(encoding='utf-8')
          css='''.kh details.blank{display:inline-block;vertical-align:baseline;margin:0 2px;padding:0;border:0;background:transparent}.kh details.blank summary{display:inline-block;cursor:pointer;border:1.5px solid #2b7a45;border-radius:4px;padding:0 7px;background:#fff;font-weight:700;list-style:none}.kh details.blank summary::-webkit-details-marker{display:none}.kh details.blank[open] summary{display:none}.kh details.blank span{display:inline-block;padding:0 7px;border-radius:4px;background:#e5f5e9;font-weight:700}\n'''
          marker='.kh .pointbox{padding:18px 22px;border-radius:12px;background:#fff8e9;border-left:5px solid #d59127}'
          assert marker in s
          s=s.replace(marker,css+marker,1)
          m=re.search(r'(<div class="summary">)([\s\S]*?)(</div></section>)',s)
          assert m
          body=m.group(2)
          reps=[
            ('공동 보고서 쓰기의 핵심','<details class="blank"><summary>□□□□</summary><span>공동 보고서</span></details> 쓰기의 핵심'),
            ('보고서의 종류는 조사 보고서로 설정된다.','보고서의 종류는 <details class="blank"><summary>□□□□</summary><span>조사 보고서</span></details>로 설정된다.'),
            ('신뢰성과 적절성을 따져야 하며','<details class="blank"><summary>□□□□</summary><span>신뢰성</span></details>과 <details class="blank"><summary>□□□□</summary><span>적절성</span></details>을 따져야 하며'),
            ('통일성을 해치므로','<details class="blank"><summary>□□□□</summary><span>통일성</span></details>을 해치므로'),
            ('<b>사회화된 필자</b>','<details class="blank"><summary>□□□□</summary><span>사회화된 필자</span></details>'),
          ]
          for a,b in reps:
              assert a in body, a
              body=body.replace(a,b,1)
          s=s[:m.start(2)]+body+s[m.end(2):]
          s=s.replace('<!-- revision: 2 -->','<!-- revision: 3 -->',1)
          p.write_text(s,encoding='utf-8'); changed.append(str(p))

          print('CHANGED')
          for x in changed: print(x)
          PY
      - name: 최종 구조 재감사
        shell: bash
        run: |
          python - <<'PY'
          import re, html
          from pathlib import Path
          files=sorted(Path('wordpress-content').glob('bisang-kangho-common2-u*.html'))
          files=[p for p in files if re.search(r'-u\d{2}-',p.name)]
          assert len(files)==14, len(files)
          banned=['자습서','평가문제집','지도서','교사용 교과서','시험 대비 정리','선생님의 보충 설명','정리 노트의 내용으로']
          def text(x):
              x=re.sub(r'<script[\s\S]*?</script>',' ',x,flags=re.I)
              x=re.sub(r'<style[\s\S]*?</style>',' ',x,flags=re.I)
              x=re.sub(r'<[^>]+>',' ',x)
              return re.sub(r'\s+',' ',html.unescape(x)).strip()
          print('FILE|REV|SUMMARY|BLANKS|SHORTQ|MCQ|Q_WITH_DETAILS|BANNED|INDEX')
          for p in files:
              s=p.read_text(encoding='utf-8')
              rev=int(re.search(r'<!--\s*revision:\s*(\d+)\s*-->',s).group(1))
              m=re.search(r'<h2[^>]*>[^<]*핵심 내용(?: 한 번에)? 정리[^<]*</h2>([\s\S]*?)(?=</section>)',s,re.I)
              summ=text(m.group(1)) if m else ''
              blanks=len(re.findall(r'class=["\'][^"\']*blank',s))
              shortq=len(re.findall(r'<article class=["\']shortq["\']',s))+len(re.findall(r'<div class=["\']sa["\']',s))+len(re.findall(r'<div class=["\']short["\']',s))
              qs=re.findall(r'<article class=["\']q["\'][^>]*>[\s\S]*?</article>',s)
              qd=sum('<details' in q for q in qs)
              b=[x for x in banned if x in s]
              idx='비상-강호영-공통국어2' in s
              print(f'{p.name}|{rev}|{len(summ)}|{blanks}|{shortq}|{len(qs)}|{qd}|{b or "-"}|{int(idx)}')
              assert rev>=2
              assert len(summ)>=500, (p.name,len(summ))
              assert blanks>=4, (p.name,blanks)
              assert len(qs)>=10, (p.name,len(qs))
              assert qd==len(qs), (p.name,qd,len(qs))
              assert not b, (p.name,b)
              assert idx, p.name
          idx=Path('wordpress-content/bisang-kangho-common2-index.html').read_text(encoding='utf-8')
          hrefs=re.findall(r'href="https://modukorean\.co\.kr/(bisang-kangho-common2-u\d{2}-[^/]+)/"',idx)
          assert len(hrefs)==14 and len(set(hrefs))==14,(len(hrefs),len(set(hrefs)))
          print('FINAL_AUDIT_SUCCESS 14/14')
          PY
      - name: 최종 수정 커밋 및 임시 작업 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-bisang-common2-final-fix.yml
          git add wordpress-content/bisang-kangho-common2-u01-ai.html wordpress-content/bisang-kangho-common2-u02-empathy.html wordpress-content/bisang-kangho-common2-u03-cheongsan.html wordpress-content/bisang-kangho-common2-u04-sipnyeon.html wordpress-content/bisang-kangho-common2-u05-sokmiin.html wordpress-content/bisang-kangho-common2-u06-azalea.html wordpress-content/bisang-kangho-common2-u10-report.html
          git commit -m '비상 강호영 공통국어2 14개 최종 감사 보정'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: 수정된 7개 WordPress 재발행
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: 65000
        run: |
          set -euo pipefail
          for f in \
            wordpress-content/bisang-kangho-common2-u01-ai.html \
            wordpress-content/bisang-kangho-common2-u02-empathy.html \
            wordpress-content/bisang-kangho-common2-u03-cheongsan.html \
            wordpress-content/bisang-kangho-common2-u04-sipnyeon.html \
            wordpress-content/bisang-kangho-common2-u05-sokmiin.html \
            wordpress-content/bisang-kangho-common2-u06-azalea.html \
            wordpress-content/bisang-kangho-common2-u10-report.html; do
              node scripts/publish-wordpress.mjs "$f"
          done
          echo 'WordPress 7개 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
