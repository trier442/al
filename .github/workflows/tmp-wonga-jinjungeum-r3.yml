name: 적용학습 고전시가01 원가 진중음 재검수 조립 게시

on:
  push:
    paths:
      - '.github/workflows/tmp-wonga-jinjungeum-r3.yml'

permissions:
  contents: write

jobs:
  assemble-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 원고 조립 및 무결성 확인
        shell: bash
        run: |
          set -euo pipefail
          TARGET='wordpress-content/2027-suteuk-wonga-jinjungeum.html'
          cat scripts/tmp-wonga-jinjungeum-r3.c0 scripts/tmp-wonga-jinjungeum-r3.c1 scripts/tmp-wonga-jinjungeum-r3.c2 | base64 -d | gzip -d > "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = 'e4d9bc1ae7e054fb5817b9825348c02d9df2237b93e16f7b5e24908398b2ddab'
          grep -q '<!-- revision: 3 -->' "$TARGET"
          grep -q '愀然獨坐危</small>' "$TARGET"
          ! grep -q '愀然獨坐危樓' "$TARGET"
          grep -q '약속을 저버린 임을 원망하는 마음' "$TARGET"
          grep -q '하루빨리 나라를 태평하게 만들고 전원으로 돌아가고 싶은 마음' "$TARGET"
          test "$(grep -o 'class=\"quiz\"' "$TARGET" | wc -l)" -eq 10
          test "$(grep -o 'class=\"choice\"' "$TARGET" | wc -l)" -eq 50
          test "$(grep -o '<li><strong>[①②③④⑤]</strong>' "$TARGET" | wc -l)" -eq 50
          ANSWERS="$(grep -o 'data-answer=\"[1-5]\"' "$TARGET" | sed -E 's/[^1-5]//g' | paste -sd' ' -)"
          test "$ANSWERS" = '3 5 2 4 1 3 5 2 4 1'
          echo "sha256=$(sha256sum "$TARGET" | awk '{print $1}')"
          echo "answers=$ANSWERS"

      - name: 최종 원고 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp-wonga-jinjungeum-r3.c0 scripts/tmp-wonga-jinjungeum-r3.c1 scripts/tmp-wonga-jinjungeum-r3.c2 .github/workflows/tmp-wonga-jinjungeum-r3.yml
          git add wordpress-content/2027-suteuk-wonga-jinjungeum.html
          git commit -m '적용학습 고전시가01 원가 진중음 EBS 원본 기준 전수 재검수 교정'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: WordPress로 전송
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: '65000'
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs wordpress-content/2027-suteuk-wonga-jinjungeum.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
