name: 비상 공통국어2 1-1 핵심문제 재작성 게시

on:
  push:
    branches: [main]
    paths:
      - "scripts/tmp-bisang-common2-u01-r4.c0"
      - "scripts/tmp-bisang-common2-u01-r4.c1"
      - ".github/workflows/tmp-bisang-common2-u01-r4.yml"

permissions:
  contents: write

jobs:
  assemble-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 원고 조립 및 무결성 확인
        shell: bash
        run: |
          set -euo pipefail
          C0='scripts/tmp-bisang-common2-u01-r4.c0'
          C1='scripts/tmp-bisang-common2-u01-r4.c1'
          TARGET='wordpress-content/bisang-kangho-common2-u01-ai.html'
          test "$(sha256sum "$C0" | awk '{print $1}')" = '8c8ab83a9d5c0fb5d24507e1560b135f7ab85b0f5a7fe42f55590232ba79067a'
          test "$(sha256sum "$C1" | awk '{print $1}')" = '61ef090dd04e4a14aaf6b4d6dbc52d324d1476bf95e345a09c165883067c7f2a'
          cat "$C0" "$C1" > /tmp/u01-r4.b64
          test "$(sha256sum /tmp/u01-r4.b64 | awk '{print $1}')" = '24ed44aa816b3ed3a1704bf640d450e3eba9c2853fa9c6452cb0131b0bf0bb8f'
          base64 -d /tmp/u01-r4.b64 | gzip -d > "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = 'cfcce0ef40f0aea880eb9135baa21a4d1b52be5e77ab9b733522e04c0e2a23d2'
          grep -q '<!-- revision: 4 -->' "$TARGET"
          test "$(grep -o 'class=\"q\"' "$TARGET" | wc -l)" -eq 10
          test "$(grep -o 'class=\"choice\"' "$TARGET" | wc -l)" -eq 50
          test "$(grep -o 'class=\"sa\"' "$TARGET" | wc -l)" -eq 15
          test "$(grep -o 'class=\"answer-toggle\"' "$TARGET" | wc -l)" -eq 15
          test "$(grep -o 'class=\"view\"' "$TARGET" | wc -l)" -eq 4
          ! grep -q '평가문제집' "$TARGET"
          ! grep -q '자습서' "$TARGET"
          ! grep -q '지도서' "$TARGET"
          ! grep -q '교사용 교과서' "$TARGET"
          ! grep -q '소단원 평가' "$TARGET"
          ! grep -q '내신 시험에서' "$TARGET"
          ANSWERS="$(grep -o 'data-answer=\"[1-5]\"' "$TARGET" | sed -E 's/[^1-5]//g' | paste -sd' ' -)"
          test "$ANSWERS" = '3 5 2 4 1 3 5 2 4 1'
          echo "sha256=$(sha256sum "$TARGET" | awk '{print $1}')"
          echo "answers=$ANSWERS"

      - name: 최종 원고 커밋 및 임시 파일 정리
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp-bisang-common2-u01-r4.c0 scripts/tmp-bisang-common2-u01-r4.c1 .github/workflows/tmp-bisang-common2-u01-r4.yml
          git add wordpress-content/bisang-kangho-common2-u01-ai.html
          git commit -m '비상 강호영 공통국어2 1-1 변형문제 전면 재작성'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: WordPress로 전송
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_REQUEST_TIMEOUT_MS: "65000"
        run: |
          set -euo pipefail
          node scripts/publish-wordpress.mjs wordpress-content/bisang-kangho-common2-u01-ai.html
          echo 'WordPress 게시 확인 완료 — success'
          echo "최종 콘텐츠 커밋: $FINAL_COMMIT"
